# Security headers for every response nginx sends (D256), included in each
# `location` of nginx.conf. Included rather than set once on the server because
# nginx drops every server-level add_header in a location that sets one of its
# own - and the page's locations set Cache-Control, so headers set only on the
# server would be missing from exactly the responses that need them.
#
# `always` adds them to error responses too.
#
# The CSP was measured against the production bundle (2026-10-22): one module
# script and one stylesheet from /assets, no inline <script> or <style>, no
# eval, no font, image (data: URIs included) or frame from another origin, and
# every API call to the page's own /api. React sets `style` props through the
# DOM, which a CSP does not govern, so style-src needs no 'unsafe-inline'. A
# new third-party origin (a CDN font, an analytics script) is refused by the
# browser until it is named here - which is the point.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
# Browsers honour HSTS only on a response that arrived over HTTPS, so it is
# inert on kind's plain http://traders.localhost and active behind any TLS
# front (Tailscale serve today, the host's edge in M10). No includeSubDomains:
# the public domain is not chosen yet (D255), and that flag binds every name
# under it.
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
# The legacy form of frame-ancestors, for browsers that predate CSP level 2.
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
