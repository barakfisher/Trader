server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The API, on the same origin as the page. The production bundle is built
    # with VITE_API_BASE_URL=/api, so the browser never talks to a second
    # address: no CORS preflight, and the session cookie (path /) is sent
    # without any cross-site rules getting involved. The trailing slash on
    # proxy_pass strips the prefix - /api/holdings reaches the orchestrator as
    # /holdings, the path its routes are registered under.
    #
    # A prefix, not the bare paths, because the two overlap: /holdings,
    # /proposals, /topics, /ask and /settings are each both a page and an API
    # route, and only a prefix tells a browser reload from a fetch.
    #
    # `orchestrator` is the service name in docker compose and the Service name
    # in Kubernetes. nginx resolves it once, at start, and exits if it cannot -
    # so this container must start after that name exists.
    location /api/ {
        proxy_pass http://orchestrator:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # nginx's default is 60 s, and a request the orchestrator forwards to
        # the AI service may wait up to SCAN_TIMEOUT_MS (5 minutes,
        # packages/shared/src/ai/client.ts) - /ask on the free model has taken
        # over 3. Slightly longer than that, so the orchestrator's own 504, which
        # says what timed out, arrives instead of nginx's anonymous one.
        proxy_read_timeout 330s;
        proxy_send_timeout 330s;
        # Imports accept a 2 MiB file (MAX_FILE_BYTES in routes/imports.ts);
        # nginx's default of 1 MiB would refuse a valid one before the
        # orchestrator could say why. The margin is multipart framing.
        client_max_body_size 3m;
    }

    # Hashed asset filenames are immutable; the entry document never is.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
