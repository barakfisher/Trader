# Local development environment.
#
# `docker compose -f infra/compose/docker-compose.yml up --build` brings up the
# whole system with the fixture market-data provider, so it works with no API
# keys and no network access to any provider.
#
# Startup order is enforced with health checks rather than sleeps: postgres and
# redis must be healthy, then migrations run to completion, then the services
# start.

name: traders

x-env: &env
  env_file:
    - ../../.env

services:
  postgres:
    # pgvector is part of the image so the RAG milestone needs no extra setup.
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-traders}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-traders}
      POSTGRES_DB: ${POSTGRES_DB:-traders}
    ports:
      # Host ports are configurable: another project may already hold the default.
      - '${POSTGRES_HOST_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-traders} -d ${POSTGRES_DB:-traders}']
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Persistence on a cache is unusual, and deliberate here. Every cached quote
    # cost an external API call against a free tier, and development restarts
    # containers constantly - without this, each restart throws the cache away
    # and the next page load refetches every symbol. Redis stores expiry times
    # as absolute instants, so entries that expired while the container was down
    # stay expired: this recovers calls without ever serving a quote past its TTL.
    command: ['redis-server', '--save', '300', '1', '--appendonly', 'yes']
    volumes:
      - redis-data:/data
    ports:
      - '${REDIS_HOST_PORT:-6379}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  # The one service that connects as the owner (POSTGRES_USER, a superuser):
  # schema changes are Alembic's alone. Everything else connects as
  # traders_app, which can read and write rows and nothing more (migration
  # 0033); migrate.py gives it APP_DB_PASSWORD after every upgrade.
  migrate:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.ai
    <<: *env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-traders}:${POSTGRES_PASSWORD:-traders}@postgres:5432/${POSTGRES_DB:-traders}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-traders_app}
    command: ['python', 'scripts/migrate.py']
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  # Loads data/corpus into kb_documents/kb_chunks, once per stack start. It is
  # separate from `migrate` rather than folded into it for two reasons: a corpus
  # that fails to parse should not read as a failed schema migration, and - more
  # importantly - it must not stop the app from starting. An empty corpus costs
  # the concept links and nothing else, so the services below deliberately wait
  # on `migrate` and not on this. A failure shows as `Exited (1)` in the
  # `compose ps` table that dev-docker.sh prints.
  #
  # Re-running it is free: the ingester compares a content hash per document and
  # writes nothing when the files have not changed, so restarting the stack does
  # not churn the chunk ids that citations point at.
  corpus:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.ai
    <<: *env
    environment:
      DATABASE_URL: postgresql://traders_app:${APP_DB_PASSWORD:-traders_app}@postgres:5432/${POSTGRES_DB:-traders}
      CORPUS_DIR: /app/data/corpus
    command: ['python', 'scripts/ingest_corpus.py']
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: 'no'

  # Loads the instrument universe (data/universe) into instruments /
  # instrument_profiles / etf_holdings and embeds it, once per stack start. The
  # same shape as `corpus` above, for the same reasons: it must not stop the app
  # starting, and re-running is free (an unchanged description keeps its vector).
  #
  # The one difference is where its input comes from. Membership and holdings
  # are committed and in the image; the descriptions are Yahoo's text, licensed
  # per installation and never committed or baked in. So the checkout's
  # data/universe is mounted read-only over the image's copy, which is how a
  # local descriptions.local.jsonl reaches the loader. Without that file this
  # exits 0 having profiled nothing, and POST /topics/resolve answers
  # `unavailable` with `universe.state: not_loaded` - a named state, not a
  # failure. The first run with the file embeds ~5,200 descriptions (about two
  # minutes and two US cents on the OpenRouter embedder); later runs embed none.
  universe:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.ai
    <<: *env
    environment:
      DATABASE_URL: postgresql://traders_app:${APP_DB_PASSWORD:-traders_app}@postgres:5432/${POSTGRES_DB:-traders}
      CORPUS_DIR: /app/data/corpus
      # The rescreen's snapshots (decision 90): the loader reads the newest of
      # these and the image's, never one older than the last it loaded.
      UNIVERSE_SNAPSHOT_DIR: /var/lib/traders/universe
    volumes:
      - ../../data/universe:/app/data/universe:ro
      - universe-snapshots:/var/lib/traders/universe
    command: ['python', 'scripts/ingest_universe.py']
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: 'no'

  ai-service:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.ai
    <<: *env
    environment:
      DATABASE_URL: postgresql://traders_app:${APP_DB_PASSWORD:-traders_app}@postgres:5432/${POSTGRES_DB:-traders}
      REDIS_URL: redis://redis:6379/0
      FIXTURES_DIR: /app/data/fixtures
      # Where the admin's rescreen writes a new universe snapshot (decision 90).
      # A named volume, so it outlives every rebuild of this container; the
      # `universe` service mounts the same one to load it on the next start.
      UNIVERSE_SNAPSHOT_DIR: /var/lib/traders/universe
    volumes:
      - universe-snapshots:/var/lib/traders/universe
    ports:
      # <host port>:<container port>. Only the left side is configurable: the
      # in-container port never changes, so AI_SERVICE_URL stays correct.
      - '${AI_SERVICE_HOST_PORT:-8000}:8000'
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  orchestrator:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.orchestrator
    <<: *env
    environment:
      DATABASE_URL: postgresql://traders_app:${APP_DB_PASSWORD:-traders_app}@postgres:5432/${POSTGRES_DB:-traders}
      AI_SERVICE_URL: http://ai-service:8000
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173}
    ports:
      - '${ORCHESTRATOR_HOST_PORT:-8080}:8080'
    depends_on:
      ai-service:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  web:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.web
      target: dev
    environment:
      # The dev server forwards /api/* here (apps/web/vite.config.ts), so the
      # browser calls the API on the page's own address, whatever name it used.
      API_PROXY_TARGET: http://orchestrator:8080
    ports:
      - '${WEB_HOST_PORT:-5173}:5173'
    depends_on:
      - orchestrator
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  universe-snapshots:
