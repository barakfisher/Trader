# The local kind cluster: Kubernetes running inside one Docker container (the
# "node"), created by scripts/k8s-up.sh and deleted by scripts/k8s-down.sh.
#
# One node that is both the control plane (the API server, the scheduler, the
# controllers that keep reality matching the manifests) and the machine the
# pods run on. A real cluster separates the two; one laptop gains nothing from it.
#
# __UNIVERSE_DIR__ is replaced by the script with an absolute path (kind wants
# one); it defaults to this checkout's data/universe. Mounts and port mappings
# are fixed when the cluster is created - changing either means recreating it.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: traders
nodes:
  - role: control-plane
    # The way in from the Mac: host port 80 -> node port 30080, where the
    # Traefik NodePort Service listens (kind/traefik.yaml). Bound to 127.0.0.1
    # only, so the cluster is not reachable from other machines on the network.
    extraPortMappings:
      - containerPort: 30080
        hostPort: 80
        listenAddress: 127.0.0.1
        protocol: TCP
    extraMounts:
      - hostPath: __UNIVERSE_DIR__
        containerPath: /traders/universe
        readOnly: true
