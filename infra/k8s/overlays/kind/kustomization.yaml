# Traders on a local kind cluster: the base, plus what only this machine has.
#
# Applied by scripts/k8s-up.sh, which also sets the image tags (the commit being
# deployed) - they change on every build, so they are not written here.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  # This machine's mail catcher (D307); a public overlay points SMTP at a real provider instead.
  - mailpit.yaml

# Mail goes to Mailpit (D258, D307).
configMapGenerator:
  - name: traders-config
    behavior: merge
    literals:
      - SMTP_HOST=mailpit
      - SMTP_PORT=1025
      - EMAIL_FROM=Traders <no-reply@traders.localhost>

# The Secret, from secrets.env beside this file. scripts/k8s-up.sh writes that
# file on first run with freshly generated values and never rewrites it; it is
# git-ignored. Hash-suffixed like the ConfigMap, so a changed secret rolls the pods that read it.
#
# A Secret is not encrypted - it is base64, readable by anyone who can read
# the namespace. What it buys is separation: it is never in git, never in an
# image, and kubectl does not print it by default.
secretGenerator:
  - name: traders-secrets
    behavior: merge
    envs:
      - secrets.env
  # The owner's password, from owner.env (git-ignored, written by k8s-up.sh): read
  # by Postgres and the migrate Job alone, never by a pod that loads every key (D300).
  - name: traders-owner
    behavior: merge
    envs:
      - owner.env

patches:
  - path: universe-descriptions.yaml
  # Mailpit's inbox on a host of its own, mailpit.localhost (D311): never the
  # app's origin, so it never receives the app's cookie, and never the Tailscale
  # name, which k8s-up.sh routes to the app alone.
  - target:
      kind: Ingress
      name: traders
    patch: |-
      - op: add
        path: /spec/rules/-
        value:
          host: mailpit.localhost
          http:
            paths:
              - path: /
                pathType: Prefix
                backend:
                  service:
                    name: mailpit
                    port:
                      name: http
