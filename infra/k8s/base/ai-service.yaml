# The AI service (FastAPI): market data, analysis, narration, retrieval.
#
# A Deployment keeps a number of identical pods running from one image. If a pod
# dies it starts another; when the image tag changes it replaces the pods - by
# default a rolling update, starting a new pod before stopping an old one, so
# there is no gap. This service keeps no state of its own (its cache, budget and
# rate limits live in Redis; what each process holds is read-only settings), so
# any number of copies can run side by side - which the autoscaler at the end of
# this file relies on.
#
# The Service `ai-service:8000` is how the orchestrator reaches it
# (AI_SERVICE_URL); with several pods it spreads requests across the ready ones.
apiVersion: v1
kind: Service
metadata:
  name: ai-service
spec:
  selector:
    app: ai-service
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-service
spec:
  # No `replicas` here, deliberately: the autoscaler below owns the count. A
  # number written here would be re-applied by every deploy, resetting the
  # copies the autoscaler had added - an ordinary deploy under load would drop
  # to one pod. Without the field, a new Deployment starts at 1 and the
  # autoscaler takes it from there.
  selector:
    matchLabels:
      app: ai-service
  template:
    metadata:
      labels:
        app: ai-service
    spec:
      # Kubernetes has no depends_on: wait until the migration Job has brought
      # the schema to this image's head (scripts/wait_for_schema.py). Runs on
      # every start, so a pod restarted long after the deploy is still guarded.
      initContainers:
        - name: wait-for-schema
          image: traders/ai-service
          command: ['python', 'scripts/wait_for_schema.py']
          envFrom:
            - configMapRef: { name: traders-config }
            - secretRef: { name: traders-secrets }
          resources:
            requests: { cpu: 10m, memory: 64Mi }
            limits: { memory: 256Mi }
      containers:
        - name: ai-service
          image: traders/ai-service
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef: { name: traders-config }
            - secretRef: { name: traders-secrets }
          # Three questions the node keeps asking the container:
          # - startup: has it finished starting? Until it has, the other two
          #   are not asked, so a slow start is not mistaken for a hang
          #   (here: up to 30 x 2 s).
          # - liveness: is the process alive? Three failures in a row and the
          #   container is restarted. /healthz depends on nothing, so a
          #   restart is never a response to Redis being down - restarting
          #   would not fix that.
          # - readiness: should the Service send it requests? /readyz answers
          #   503 when Redis is unreachable; the pod is taken out of rotation
          #   until it recovers, and not restarted.
          startupProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          # requests: what the scheduler reserves for the pod, and the
          # baseline the autoscaler measures CPU against. limits.memory: past
          # this the container is stopped rather than starving its neighbours.
          # No CPU limit, deliberately: a limit throttles even an idle machine.
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 1Gi }
---
# A HorizontalPodAutoscaler changes how many copies of a Deployment run, from
# measurements: every 15 s it reads each pod's CPU use from metrics-server,
# compares the average with the pods' CPU *request* (100m above), and adds or
# removes pods to bring the average back to the target.
#
# Why this service and not the orchestrator: the AI service is where the CPU
# goes (analysis, embeddings, retrieval) and it keeps nothing in memory that a
# second copy would disagree with. The orchestrator holds import previews in
# memory and must stay a single copy (orchestrator.yaml).
#
# - 1 to 3 copies. The floor is one: this is a single-user app, and an idle
#   copy costs ~250 MiB. The ceiling keeps three copies inside a laptop's
#   Docker memory next to everything else.
# - Target 70% of the request: busy enough to be worth a copy, with headroom
#   for the burst while a new pod starts (its init container checks the schema,
#   then the startup probe waits for /healthz).
# - Scale up only on load that lasts: a copy is added only when CPU has stayed
#   above target for a full minute. Measured on the cluster: a 4-second
#   portfolio scan pushed one 15 s reading over target and the autoscaler added
#   a copy - which needs 15-20 s to start, so it arrived after the scan had
#   finished, then idled for five minutes, every half hour. Real traffic (the
#   load test, many users) lasts; a single scan's burst does not.
# - Scale down slowly: a copy is removed only after five minutes below target,
#   so the pods do not flap during a scan that pauses between holdings.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ai-service
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ai-service
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    # The autoscaler takes the lowest recommendation seen in this window, so a
    # short burst never adds a copy; only load above target for the whole
    # minute does.
    scaleUp:
      stabilizationWindowSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
