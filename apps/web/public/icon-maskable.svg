<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="TikLens">
  <!-- logo.svg for a launcher that crops to its own shape: the tile fills the square, and the mark is
       scaled to 80% about the centre, the area every mask keeps. Keep in step with logo.svg. -->
  <rect width="512" height="512" fill="#6d8bff"/>
  <g transform="translate(51.2 51.2) scale(0.8)">
    <polyline points="104,360 208,248 288,312 408,168" fill="none" stroke="#fff" stroke-width="64" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="408" cy="168" r="44" fill="#35d39a" stroke="#fff" stroke-width="20"/>
  </g>
</svg>
