[project]
name = "traders-ai"
version = "0.1.0"
description = "AI & analytics microservice: market data providers, analysis pipeline, RAG engine"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.6",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.2",
    "httpx>=0.27.2",
    "redis>=5.0.8",
    "structlog>=24.4.0",
    "sqlalchemy>=2.0.35",
    "alembic>=1.13.3",
    "psycopg[binary]>=3.2.2",
    "yfinance>=0.2.44",
    "python-dateutil>=2.9.0",
    # Topic disambiguation clusters candidate vectors (app/topics/meanings.py).
    # Already present through yfinance; declared because it is now used directly.
    "numpy>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.8",
    "mypy>=1.11.2",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]
# B008 flags function calls in argument defaults, which is precisely how FastAPI
# dependency injection is spelled (`= Depends(...)`, `= Query(...)`).
ignore = ["B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.mypy]
python_version = "3.12"
strict = false
warn_unused_ignores = true
ignore_missing_imports = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
