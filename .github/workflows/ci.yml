name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ai-service:
    name: ai-service (python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ai
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - name: Install dependencies
        run: uv venv --python 3.12 && uv pip install -e '.[dev]'
      - name: Lint
        run: |
          .venv/bin/ruff check .
          .venv/bin/ruff format --check .
      - name: Test
        # The fixture provider makes the suite hermetic: no network, no API keys.
        env:
          MARKET_DATA_PROVIDERS: fixture
        run: .venv/bin/pytest -q
      - name: OpenAPI schema is up to date
        run: |
          .venv/bin/python scripts/export_openapi.py
          git diff --exit-code openapi.json \
            || (echo "openapi.json is stale: run 'python scripts/export_openapi.py' and commit" && exit 1)

  node:
    name: orchestrator + web (typescript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm -r typecheck
      - name: Test
        run: pnpm -r test
      - name: Build web bundle
        run: pnpm --filter @traders/web build
      - name: Generated API client is up to date
        run: |
          pnpm gen:api
          git diff --exit-code packages/shared/src/generated \
            || (echo "generated client is stale: run 'pnpm gen:api' and commit" && exit 1)

  compose:
    name: docker compose smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare environment
        run: |
          cp .env.example .env
          sed -i 's/^APP_PASSPHRASE=.*/APP_PASSPHRASE=ci-passphrase/' .env
          sed -i 's/^SESSION_SECRET=.*/SESSION_SECRET=ci-session-secret-value-long-enough/' .env
          sed -i 's/^MARKET_DATA_PROVIDERS=.*/MARKET_DATA_PROVIDERS=fixture/' .env
      - name: Start the stack
        run: docker compose -f infra/compose/docker-compose.yml up -d --build postgres redis migrate ai-service orchestrator
      - name: Wait for readiness
        run: |
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:8080/readyz > /dev/null; then echo ready; exit 0; fi
            sleep 5
          done
          docker compose -f infra/compose/docker-compose.yml logs
          exit 1
      - name: Smoke test the vertical slice
        run: bash scripts/smoke-test.sh
      - name: Dump logs on failure
        if: failure()
        run: docker compose -f infra/compose/docker-compose.yml logs
      - name: Tear down
        if: always()
        run: docker compose -f infra/compose/docker-compose.yml down -v
