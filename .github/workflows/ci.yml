name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ai-service:
    name: ai-service (python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ai
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - name: Install dependencies
        run: uv venv --python 3.12 && uv pip install -e '.[dev]'
      - name: Lint
        run: |
          .venv/bin/ruff check .
          .venv/bin/ruff format --check .
      - name: Test
        # The fixture provider makes the suite hermetic: no network, no API keys.
        env:
          MARKET_DATA_PROVIDERS: fixture
        run: .venv/bin/pytest -q
      - name: OpenAPI schema is up to date
        run: |
          .venv/bin/python scripts/export_openapi.py
          git diff --exit-code openapi.json \
            || (echo "openapi.json is stale: run 'python scripts/export_openapi.py' and commit" && exit 1)

  node:
    name: orchestrator + web (typescript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No `version:` here on purpose. The action reads `packageManager` from
      # package.json, and declaring it in both places is a hard error:
      # "Multiple versions of pnpm specified". package.json is the single source
      # of truth, so local installs and CI cannot drift apart.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm -r typecheck
      - name: Test
        run: pnpm -r test
      - name: Build web bundle
        run: pnpm --filter @traders/web build
      - name: Generated API client is up to date
        run: |
          pnpm gen:api
          git diff --exit-code packages/shared/src/generated \
            || (echo "generated client is stale: run 'pnpm gen:api' and commit" && exit 1)

  compose:
    name: docker compose smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare environment
        run: |
          cp .env.example .env
          sed -i 's/^APP_PASSPHRASE=.*/APP_PASSPHRASE=ci-passphrase/' .env
          sed -i 's/^SESSION_SECRET=.*/SESSION_SECRET=ci-session-secret-value-long-enough/' .env
          sed -i 's/^MARKET_DATA_PROVIDERS=.*/MARKET_DATA_PROVIDERS=fixture/' .env
      - name: Start the stack
        run: docker compose -f infra/compose/docker-compose.yml up -d --build postgres redis migrate corpus ai-service orchestrator
      # The hermetic Python suite cannot reach this: it has no Postgres, and its
      # corpus tests run against the checkout rather than the image. This is the
      # only gate that proves data/corpus was actually copied in, that the
      # in-container path resolves, and that the ingester's SQL runs.
      - name: Check the corpus was ingested
        # Waits for the container to *stop* before reading its exit code. The
        # check this replaced read `.ExitCode` immediately, and a container that
        # is still running reports 0 - so it passed whenever it read mid-
        # ingestion. `docker compose wait` is not the fix either: for a service
        # that has already exited it returns 1. See scripts/wait-for-exit.sh,
        # which was run against all four states before being trusted.
        run: bash scripts/wait-for-exit.sh infra/compose/docker-compose.yml corpus
      - name: Wait for readiness
        run: |
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:8080/readyz > /dev/null; then echo ready; exit 0; fi
            sleep 5
          done
          docker compose -f infra/compose/docker-compose.yml logs
          exit 1
      - name: Smoke test the vertical slice
        run: bash scripts/smoke-test.sh
      # The /ask eval set, keyless tier (M3 slice 4). Runs inside the image
      # against the corpus the `corpus` container just ingested, on the fixture
      # embedder - so it proves routing, the deterministic refusals, portfolio
      # arithmetic and citation shape on every PR. It cannot prove the
      # `not_in_corpus` refusal: the relevance floor abstains on the fixture by
      # design. That is the keyed job's, below.
      - name: Eval set (keyless tier)
        run: >
          docker compose -f infra/compose/docker-compose.yml exec -T
          -e CORPUS_DIR=/app/data/corpus
          ai-service python scripts/run_eval.py --tier keyless
      - name: Dump logs on failure
        if: failure()
        run: docker compose -f infra/compose/docker-compose.yml logs
      - name: Tear down
        if: always()
        run: docker compose -f infra/compose/docker-compose.yml down -v

  # The /ask eval set, keyed tier: the only automated test of the refusal M3's
  # exit criterion names, and of the relevance thresholds on held-out questions.
  #
  # Opt-in by the presence of a secret, not by a flag, and that is the design
  # rather than a compromise. CI stays hermetic for anyone without the key -
  # forks, a fresh clone, an expired or spent budget - because the job then
  # *skips visibly* and succeeds, instead of turning every PR red for a reason
  # unrelated to the change. A test that depends on a credential is the
  # `.env`-dependent-test failure CLAUDE.md warns about, at CI scale; making it
  # a separate, skippable job is what keeps that failure out of the other three.
  #
  # Cost per run: re-embedding the corpus is ~5,100 tokens at $0.02/1M, about
  # one hundredth of a cent, plus 35 query embeddings. No model is called.
  eval-keyed:
    name: eval set (keyed, opt-in)
    runs-on: ubuntu-latest
    env:
      # `secrets` cannot be read in a job-level `if`, so presence is computed
      # once here and every step keys off it.
      HAS_KEY: ${{ secrets.OPENROUTER_API_KEY != '' }}
    steps:
      - name: Skip visibly when no key is configured
        if: env.HAS_KEY != 'true'
        # A notice rather than silence: a green job that did nothing looks
        # exactly like a green job that tested the refusal path, and only one
        # of them did.
        run: >
          echo "::notice title=Keyed eval skipped::No OPENROUTER_API_KEY secret is configured,
          so the not_in_corpus refusal and the relevance thresholds were NOT tested on this run."
      - uses: actions/checkout@v4
        if: env.HAS_KEY == 'true'
      - name: Prepare environment
        if: env.HAS_KEY == 'true'
        env:
          KEY: ${{ secrets.OPENROUTER_API_KEY }}
        # The key is appended rather than substituted with sed, so no character
        # in it can be read as sed syntax. GitHub masks it in every log line.
        run: |
          grep -vE '^(OPENROUTER_API_KEY|EMBEDDINGS_PROVIDER|LLM_PROVIDER)=' .env.example > .env
          printf 'OPENROUTER_API_KEY=%s\nEMBEDDINGS_PROVIDER=openrouter\nLLM_PROVIDER=null\n' "$KEY" >> .env
          sed -i 's/^MARKET_DATA_PROVIDERS=.*/MARKET_DATA_PROVIDERS=fixture/' .env
      - name: Start the database and ingest with the real embedder
        if: env.HAS_KEY == 'true'
        run: docker compose -f infra/compose/docker-compose.yml up -d --build postgres redis migrate corpus ai-service
      - name: Check the corpus was embedded by the real model
        if: env.HAS_KEY == 'true'
        run: |
          bash scripts/wait-for-exit.sh infra/compose/docker-compose.yml corpus
          # A run that silently fell back to the fixture would still exit 0, and
          # every keyed case would then be measured against the wrong embedder.
          docker compose -f infra/compose/docker-compose.yml logs corpus \
            | grep -q 'chunks embedded: .* (model: openai/text-embedding-3-small)' \
            || { echo "corpus was not embedded by the real model"; exit 1; }
      - name: Eval set (keyed tier)
        if: env.HAS_KEY == 'true'
        run: >
          docker compose -f infra/compose/docker-compose.yml exec -T
          -e CORPUS_DIR=/app/data/corpus
          ai-service python scripts/run_eval.py --tier keyed
      - name: Dump logs on failure
        if: failure() && env.HAS_KEY == 'true'
        run: docker compose -f infra/compose/docker-compose.yml logs
      - name: Tear down
        if: always() && env.HAS_KEY == 'true'
        run: docker compose -f infra/compose/docker-compose.yml down -v
